[package]
name = "tehuti-core"
version = "0.1.0"
edition = "2021"

# NOTE: Currently built as a .node binary.
# Prepared for future compilation to `wasm32-wasip1-threads`.
# When migrating, ensure dependencies (e.g., rayon, tokio) support WASI threads.

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16.14", default-features = false, features = ["napi4", "async", "tokio_rt"] }
napi-derive = "2.16.12"
rayon = "1.10.0"
ignore = "0.4.23"

[build-dependencies]
napi-build = "2.1.4"
